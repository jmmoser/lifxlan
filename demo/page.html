<title>lifxlan Live Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the room and its controls on the left, the wire (network, log, packet, lab) on the right; one column on a phone. */
:root {
  --bg: #e9ecf1;
  --surface: #ffffff;
  --sunken: #f1f3f7;
  --ink: #151821;
  --muted: #565e72;
  --line: #d0d5df;
  --accent: #96500a;
  --accent-ink: #ffffff;
  --accent-soft: #ffe6c0;
  --tx: #a35805;
  --rx: #0a6c7d;
  --call: #454c61;
  --bad: #b3362b;
  --good: #1f7a36;
  --f0: hsl(28 90% 46%);
  --f1: hsl(190 85% 38%);
  --f2: hsl(330 75% 50%);
  --f3: hsl(140 65% 36%);
  --f4: hsl(265 70% 56%);
  --f5: hsl(52 90% 40%);
  --f6: hsl(212 85% 50%);
  --f7: hsl(5 80% 52%);
  --tone: 22%;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f15;
    --surface: #161922;
    --sunken: #0f1118;
    --ink: #e7e9f0;
    --muted: #99a1b5;
    --line: #2a2f3d;
    --accent: #ffb454;
    --accent-ink: #1a1206;
    --accent-soft: #3a2a10;
    --tx: #ffb454;
    --rx: #62d2e2;
    --call: #aab1c4;
    --bad: #ff8172;
    --good: #7ad891;
    --f0: hsl(28 95% 60%);
    --f1: hsl(190 85% 58%);
    --f2: hsl(330 85% 68%);
    --f3: hsl(140 65% 58%);
    --f4: hsl(265 90% 74%);
    --f5: hsl(52 90% 58%);
    --f6: hsl(212 95% 68%);
    --f7: hsl(5 95% 68%);
    --tone: 30%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f15;
  --surface: #161922;
  --sunken: #0f1118;
  --ink: #e7e9f0;
  --muted: #99a1b5;
  --line: #2a2f3d;
  --accent: #ffb454;
  --accent-ink: #1a1206;
  --accent-soft: #3a2a10;
  --tx: #ffb454;
  --rx: #62d2e2;
  --call: #aab1c4;
  --bad: #ff8172;
  --good: #7ad891;
  --f0: hsl(28 95% 60%);
  --f1: hsl(190 85% 58%);
  --f2: hsl(330 85% 68%);
  --f3: hsl(140 65% 58%);
  --f4: hsl(265 90% 74%);
  --f5: hsl(52 90% 58%);
  --f6: hsl(212 95% 68%);
  --f7: hsl(5 95% 68%);
  --tone: 30%;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--body);
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, p { margin: 0; }
h1 { font: 700 clamp(22px, 2.6vw, 30px)/1.1 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
h2 { font: 600 15px/1.2 var(--display); letter-spacing: 0.01em; }
h3 { font: 600 11px/1.2 var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
code, .mono { font-family: var(--mono); font-size: 0.93em; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.masthead .lede { max-width: 86ch; margin-top: 6px; }
.lede { color: var(--muted); }
.lede code { color: var(--ink); }

.layout { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.column { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* The room is night whatever the page theme: its colors are fixed. */
.room { background: #0b0c12; border-radius: 12px; overflow: hidden; border: 1px solid #262a38; }
.stage-canvas { display: block; width: 100%; aspect-ratio: 1000 / 540; cursor: pointer; }
.stage-canvas.paintable { cursor: crosshair; touch-action: none; }
.caption { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 14px 10px; color: #99a1b5; font-size: 12px; border-top: 1px solid #1c1f2b; }
.caption .grow { flex: 1; }
.caption .key { width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; }
.caption .key:first-child { margin-left: 0; }
.caption .key.tx { background: #ffb454; }
.caption .key.rx { background: #62d2e2; }
.caption .key.lost { background: transparent; border: 1.5px solid #ff6e60; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.card-head h2 { margin-right: auto; }
.head-tools, .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.devices-head { border-top: 1px solid var(--line); padding-top: 12px; }

.chip, .primary, .segmented button, .tab {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 10px; cursor: pointer;
  font-size: 13px; line-height: 1.3; white-space: nowrap;
}
.chip:hover, .segmented button:hover { border-color: var(--muted); }
.chip.quiet { border-style: dashed; color: var(--muted); }
.chip[aria-pressed="true"], .segmented button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip.toggle[aria-pressed="true"]::before { content: "● "; color: var(--accent); }
.chip.gradient { padding-bottom: 9px; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--surface); position: relative; }
.chip.gradient::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 3px; height: 4px; border-radius: 2px; background: var(--preview); }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.primary:disabled { opacity: 0.5; cursor: not-allowed; }
.segmented { display: inline-flex; }
.segmented button { border-radius: 0; margin-left: -1px; padding: 4px 9px; font-size: 12px; }
.segmented button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.segmented button:last-child { border-radius: 0 7px 7px 0; }
.segmented button[aria-pressed="true"] { position: relative; z-index: 1; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { display: inline-flex; align-items: center; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.on { background: var(--accent); border-color: var(--accent); }

.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.identity { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.label-edit, .tools { display: flex; gap: 6px; flex-wrap: wrap; }
.label-edit input { border: 1px solid var(--line); background: var(--sunken); border-radius: 7px; padding: 5px 9px; font-weight: 600; width: 15ch; min-width: 0; }
.meta { color: var(--muted); font: 12px/1.6 var(--mono); overflow-wrap: anywhere; }
.pill { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; white-space: nowrap; }
.block { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.block-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.fade { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px 20px; }
.hint, .note, .status, .empty { color: var(--muted); font-size: 12.5px; }
.note.bad, .status.bad { color: var(--bad); }
.status { min-height: 1.45em; }
.status:empty { display: none; }
.empty { padding: 8px 0; }

.slider { display: grid; grid-template-columns: 78px minmax(0, 1fr) 118px; align-items: center; gap: 10px; }
.slider label { font-size: 13px; }
.readout { font: 12px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 480px) { .slider { grid-template-columns: 70px minmax(0, 1fr); } .readout { grid-column: 2; text-align: left; } }
input[type="range"] { appearance: none; -webkit-appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--track, var(--line)); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.14); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--track, var(--line)); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.14); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -4px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
.swatch-row { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch-button { width: 28px; height: 22px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.swatch-button:hover { border-color: var(--ink); }

.counters { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counters b { color: var(--ink); font-weight: 600; }

/* Wire log */
.tag { display: inline-block; font: 600 10px/1 var(--mono); letter-spacing: 0.04em; padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; text-align: center; }
.tag.tx { color: var(--tx); }
.tag.rx { color: var(--rx); }
.tag.call { color: var(--call); }
.log-legend { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; color: var(--muted); font-size: 12px; }
.log-legend .tag { margin-left: 8px; }
.log-legend .tag:first-child { margin-left: 0; }
.log-list { height: 330px; overflow-y: auto; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 4px; font: 12px/1.35 var(--mono); }
.row { display: grid; align-items: baseline; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 3px 6px; border-radius: 5px; cursor: pointer; font: inherit; color: var(--ink); }
.row.packet { grid-template-columns: 6ch 3.6ch minmax(0, 1.25fr) minmax(0, 0.9fr) minmax(0, 1.15fr); }
.row.call { grid-template-columns: 6ch 3.6ch minmax(0, 1fr) auto; margin-top: 3px; }
.row:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.row.selected { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.row .time { color: var(--muted); font-variant-numeric: tabular-nums; }
.row .tag { padding: 2px 0; border: 0; text-align: left; }
.row .what { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.tx .what { color: var(--tx); }
.row.rx .what { color: var(--rx); }
.row .peer, .row .meta { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { text-align: right; }
.row .count { color: var(--ink); font-weight: 600; margin-right: 6px; }
.row .bad { color: var(--bad); }
.row.lost .what { text-decoration: line-through; }
.row .code { font-size: 1em; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.row .outcome { white-space: nowrap; color: var(--muted); }
.row .outcome.ok { color: var(--good); }
.row .outcome.error { color: var(--bad); font-weight: 600; }

@media (max-width: 560px) {
  .row.packet { grid-template-columns: 6ch 3.6ch minmax(0, 1.2fr) minmax(0, 1fr); }
  .row.packet .meta { grid-column: 3 / -1; text-align: left; }
  .log-list { height: 300px; }
}

/* Inspector */
.inspector-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.summary strong { font: 600 15px var(--display); }
.summary .route { color: var(--muted); font: 12px var(--mono); margin-right: auto; overflow-wrap: anywhere; }
.anatomy { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hex { display: grid; grid-template-columns: 5ch repeat(16, 2.55ch); font: 12px/1.75 var(--mono); overflow: auto; max-height: 232px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.hex .offset { color: var(--muted); user-select: none; }
.hex .b { text-align: center; cursor: default; }
.hex .b.rsv { color: var(--muted); opacity: 0.6; }
.f0 { --c: var(--f0); } .f1 { --c: var(--f1); } .f2 { --c: var(--f2); } .f3 { --c: var(--f3); }
.f4 { --c: var(--f4); } .f5 { --c: var(--f5); } .f6 { --c: var(--f6); } .f7 { --c: var(--f7); }
.hex .b[class*=" f"] { background: color-mix(in srgb, var(--c) var(--tone), transparent); }
.hex .b.hot { background: var(--c); color: var(--surface); opacity: 1; }
.hex .b.rsv.hot { background: var(--muted); }
.fields { display: flex; flex-direction: column; max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; }
.fields .section { position: sticky; top: 0; background: var(--surface); padding: 5px 10px; font: 600 11px var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); z-index: 1; }
.field { display: grid; grid-template-columns: 10px minmax(0, 0.8fr) 7ch minmax(0, 1.6fr); gap: 8px; align-items: baseline; padding: 3px 10px; }
.field.hot { background: color-mix(in srgb, var(--c, var(--muted)) var(--tone), transparent); }
.field .key { width: 10px; height: 10px; border-radius: 3px; background: var(--c); align-self: center; }
.field .key.rsv { background: none; border: 1px dashed var(--muted); }
.field .name { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.field .at { font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.field .value { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.field.reserved { color: var(--muted); }
.field.reserved .name, .dim { color: var(--muted); }
.swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); vertical-align: -1px; }
.color-value .swatch { margin-right: 6px; }
.swatches { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px 0; }
.swatches.n64 { display: grid; grid-template-columns: repeat(8, 11px); }
.code-block { margin: 0; font: 12px/1.5 var(--mono); background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
.code-block.bad { color: var(--bad); }

/* Lab */
.lab-input { width: 100%; min-height: 84px; resize: vertical; font: 12.5px/1.6 var(--mono); background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.lab-send { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lab-send select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 8px; min-width: 0; max-width: 100%; }
.lab-send label { color: var(--muted); font-size: 13px; }
.note:empty { display: none; }

.foot { color: var(--muted); font-size: 12.5px; max-width: 90ch; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<!-- body -->
<div id="app"><noscript>This demo runs the lifxlan library in the page and needs JavaScript.</noscript></div>
<!-- script -->
