<title>Nightwire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the room and its controls on the left, the wire (network, log, packet, lab) on the right; one column on a phone. */
:root {
  --bg: #e9ecf1;
  --surface: #ffffff;
  --sunken: #f1f3f7;
  --ink: #151821;
  --muted: #565e72;
  --line: #d0d5df;
  --accent: #96500a;
  --accent-ink: #ffffff;
  --accent-soft: #ffe6c0;
  --tx: #a35805;
  --rx: #0a6c7d;
  --call: #454c61;
  --bad: #b3362b;
  --good: #1f7a36;
  --f0: hsl(28 90% 46%);
  --f1: hsl(190 85% 38%);
  --f2: hsl(330 75% 50%);
  --f3: hsl(140 65% 36%);
  --f4: hsl(265 70% 56%);
  --f5: hsl(52 90% 40%);
  --f6: hsl(212 85% 50%);
  --f7: hsl(5 80% 52%);
  --tone: 22%;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f15;
    --surface: #161922;
    --sunken: #0f1118;
    --ink: #e7e9f0;
    --muted: #99a1b5;
    --line: #2a2f3d;
    --accent: #ffb454;
    --accent-ink: #1a1206;
    --accent-soft: #3a2a10;
    --tx: #ffb454;
    --rx: #62d2e2;
    --call: #aab1c4;
    --bad: #ff8172;
    --good: #7ad891;
    --f0: hsl(28 95% 60%);
    --f1: hsl(190 85% 58%);
    --f2: hsl(330 85% 68%);
    --f3: hsl(140 65% 58%);
    --f4: hsl(265 90% 74%);
    --f5: hsl(52 90% 58%);
    --f6: hsl(212 95% 68%);
    --f7: hsl(5 95% 68%);
    --tone: 30%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f15;
  --surface: #161922;
  --sunken: #0f1118;
  --ink: #e7e9f0;
  --muted: #99a1b5;
  --line: #2a2f3d;
  --accent: #ffb454;
  --accent-ink: #1a1206;
  --accent-soft: #3a2a10;
  --tx: #ffb454;
  --rx: #62d2e2;
  --call: #aab1c4;
  --bad: #ff8172;
  --good: #7ad891;
  --f0: hsl(28 95% 60%);
  --f1: hsl(190 85% 58%);
  --f2: hsl(330 85% 68%);
  --f3: hsl(140 65% 58%);
  --f4: hsl(265 90% 74%);
  --f5: hsl(52 90% 58%);
  --f6: hsl(212 95% 68%);
  --f7: hsl(5 95% 68%);
  --tone: 30%;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--body);
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, p { margin: 0; }
h1 { font: 700 clamp(22px, 2.6vw, 30px)/1.1 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
h2 { font: 600 15px/1.2 var(--display); letter-spacing: 0.01em; }
h3 { font: 600 11px/1.2 var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
code, .mono { font-family: var(--mono); font-size: 0.93em; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.masthead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.masthead .lede { max-width: 92ch; margin-top: 6px; }
.modes { flex: none; }
.lede { color: var(--muted); }
.lede code { color: var(--ink); }

.layout { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); gap: 16px; align-items: start; }
#app.theater .layout { grid-template-columns: minmax(0, 1fr); }
#app.theater .layout > .column:nth-child(2) { display: none; }
.column { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* The arena is night whatever the page theme: its colours are fixed. */
.arena { position: relative; background: #05060a; border-radius: 12px; overflow: hidden; border: 1px solid #262a38; color: #e8ebf3; }
.arena-view { position: relative; }
.arena:fullscreen { display: flex; flex-direction: column; justify-content: center; border-radius: 0; border: 0; }
.arena:fullscreen .arena-view { width: min(100%, calc((100vh - 58px) * 16 / 9)); margin: 0 auto; }
.arena-canvas { display: block; width: 100%; aspect-ratio: 16 / 9; touch-action: manipulation; }
.arena-canvas.aiming { cursor: none; }
.arena-canvas.sandbox { cursor: crosshair; touch-action: none; }

.hud { position: absolute; inset: 0 0 auto; pointer-events: none; font-family: var(--body); }
.hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 10px 14px; text-shadow: 0 1px 6px rgb(0 0 0 / 0.9); }
.hud-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.signal { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
.signal i { width: 5px; border-radius: 1.5px; background: rgb(255 255 255 / 0.16); }
.signal i:nth-child(1) { height: 30%; } .signal i:nth-child(2) { height: 47%; } .signal i:nth-child(3) { height: 64%; }
.signal i:nth-child(4) { height: 82%; } .signal i:nth-child(5) { height: 100%; }
.signal i.on { background: #7ae69a; box-shadow: 0 0 8px rgb(122 230 154 / 0.7); }
.signal.low i.on { background: #ff6e60; box-shadow: 0 0 8px rgb(255 110 96 / 0.8); }
.night { font: 600 12.5px/1.2 var(--body); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { width: 150px; max-width: 30vw; height: 3px; border-radius: 2px; background: rgb(255 255 255 / 0.16); margin-top: 5px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: #ffb454; transition: width 0.3s; }
.tally { display: flex; align-items: baseline; gap: 8px; }
.score { font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.combo { font: 700 15px/1 var(--display); color: #ffb454; min-width: 2ch; }
.nets { display: flex; gap: 6px; }
.net { font: 500 10.5px/1 var(--mono); padding: 3px 6px; border-radius: 4px; background: rgb(8 9 14 / 0.6); color: #99a1b5; border: 1px solid rgb(255 255 255 / 0.1); }
.net.bad { color: #ff8172; border-color: rgb(255 129 114 / 0.6); }
.boss { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: min(46%, 420px); display: flex; flex-direction: column; gap: 4px; align-items: center; font: 600 11px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; text-shadow: 0 1px 6px #000; }
.boss-track { width: 100%; height: 6px; border-radius: 3px; background: rgb(255 255 255 / 0.14); overflow: hidden; }
.boss-track i { display: block; height: 100%; background: linear-gradient(90deg, #ff5a4d, #ffb454, #7ae69a, #62d2e2, #6c7dff, #ff6ad5); transition: width 0.2s; }
.dock { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; padding: 9px 12px; background: #0b0d13; border-top: 1px solid #1c1f2b; }
.palette { display: flex; gap: 6px; padding: 5px; border-radius: 10px; background: rgb(255 255 255 / 0.04); border: 1px solid rgb(255 255 255 / 0.1); }
.swatch-key { width: 34px; height: 30px; border-radius: 6px; border: 2px solid transparent; background: var(--hue); cursor: pointer; padding: 0; font: 700 12px/1 var(--mono); color: rgb(5 6 10 / 0.85); transition: transform 0.08s; }
.swatch-key[aria-pressed="true"] { border-color: #fff; transform: translateY(-3px) scale(1.08); box-shadow: 0 0 14px var(--hue); }
.dock-button { border: 1px solid rgb(255 255 255 / 0.18); background: rgb(8 9 14 / 0.66); color: #e8ebf3; border-radius: 9px; padding: 8px 12px; font: 600 12.5px/1 var(--body); cursor: pointer; white-space: nowrap; }
.dock-button:hover { border-color: rgb(255 255 255 / 0.5); }
.dock-button kbd { font: 600 10px/1 var(--mono); margin-left: 7px; padding: 2px 4px; border-radius: 3px; border: 1px solid rgb(255 255 255 / 0.3); color: #99a1b5; }
.dock-button.ready { border-color: #ffb454; box-shadow: 0 0 0 0 rgb(255 180 84 / 0.7); animation: beckon 1.1s ease-out infinite; }
.dock-button.cast { background: linear-gradient(90deg, rgb(255 180 84 / 0.42) var(--charge, 0%), rgb(8 9 14 / 0.66) var(--charge, 0%)); }
.dock-button.cast:disabled { cursor: default; color: #99a1b5; }
@keyframes beckon { to { box-shadow: 0 0 0 12px rgb(255 180 84 / 0); } }
.hint-banner { position: absolute; top: 50px; left: 50%; transform: translate(-50%, -6px); max-width: min(80%, 620px); margin: 0; padding: 8px 14px; border-radius: 9px; background: rgb(8 9 14 / 0.82); border: 1px solid rgb(255 255 255 / 0.14); font: 500 13px/1.4 var(--body); text-align: center; text-wrap: balance; opacity: 0; transition: opacity 0.35s, transform 0.35s; pointer-events: none; }
.hint-banner.show { opacity: 1; transform: translate(-50%, 0); }

.stinger { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; pointer-events: none; opacity: 0; text-shadow: 0 2px 24px rgb(0 0 0 / 0.9); }
.stinger span { font: 600 13px/1 var(--mono); letter-spacing: 0.3em; text-transform: uppercase; color: #ffb454; }
.stinger strong { font: 700 clamp(26px, 5.2vw, 58px)/1 var(--display); letter-spacing: 0.02em; text-align: center; text-wrap: balance; }
.stinger.go { animation: sting 2.4s ease-out both; }
@keyframes sting { 0% { opacity: 0; transform: scale(1.18); letter-spacing: 0.2em; } 14% { opacity: 1; transform: scale(1); } 72% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.97); } }
.overlay { position: absolute; inset: 0; z-index: 2; display: none; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.overlay.show { display: flex; }
.overlay.briefing, .overlay.won, .overlay.lost { background: radial-gradient(ellipse at center, rgb(5 6 10 / 0.5), rgb(5 6 10 / 0.86)); }
.overlay.title { background: radial-gradient(ellipse at center, rgb(5 6 10 / 0.62), rgb(5 6 10 / 0.3) 70%); }
.overlay.paused { background: rgb(5 6 10 / 0.35); }
.card-over { width: min(100%, 560px); max-height: 100%; display: flex; flex-direction: column; gap: 10px; margin: auto; font-size: 13.5px; line-height: 1.5; }
.overlay.briefing .card-over, .overlay.won .card-over, .overlay.lost .card-over, .overlay.paused .card-over { background: rgb(12 14 21 / 0.94); border: 1px solid rgb(255 255 255 / 0.14); border-radius: 14px; padding: 20px 22px; overflow: auto; }
.overlay.paused .card-over { width: min(100%, 400px); }
.overlay.title .card-over { align-items: center; text-align: center; width: min(100%, 640px); }
.card-over h2 { font: 700 26px/1.1 var(--display); letter-spacing: -0.01em; }
.card-over p { color: #c3c9d8; }
.eyebrow { font: 600 11px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: #ffb454 !important; }
.wordmark { font: 700 clamp(40px, 9vw, 92px)/0.95 var(--display) !important; letter-spacing: 0.08em !important; color: #fff; padding-bottom: 12px; background: linear-gradient(90deg, #ff5a4d, #ffd24d, #5fe07a, #62d2e2, #6c7dff, #ff6ad5) bottom / 100% 5px no-repeat; text-shadow: 0 0 40px rgb(255 180 84 / 0.35); }
.pitch { font-size: 15.5px; max-width: 46ch; text-wrap: balance; color: #e8ebf3 !important; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.overlay.title .actions { justify-content: center; }
.big { font: 600 15px/1 var(--body); padding: 12px 22px; border-radius: 10px; cursor: pointer; }
.arena .primary { background: #ffb454; border: 1px solid #ffb454; color: #1a1206; }
.arena .primary:hover { background: #ffc67a; }
.ghost { background: rgb(255 255 255 / 0.06); border: 1px solid rgb(255 255 255 / 0.22); color: #e8ebf3; }
.ghost:hover { border-color: rgb(255 255 255 / 0.6); }
.keys { display: grid; grid-template-columns: auto auto; gap: 3px 14px; margin: 8px 0 0; font-size: 12.5px; text-align: left; }
.keys dt { font-family: var(--mono); color: #ffb454; text-align: right; }
.keys dd { margin: 0; color: #c3c9d8; }
.best, .debrief { font: 12px/1.5 var(--mono); color: #99a1b5 !important; }
.final b { font: 700 30px/1 var(--display); color: #fff; font-variant-numeric: tabular-nums; }
.arena .code-block { background: rgb(0 0 0 / 0.4); border-color: rgb(255 255 255 / 0.12); color: #ffd9a0; max-height: none; }
.news { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.news li { font: 500 12px/1 var(--body); padding: 5px 9px; border-radius: 999px; border: 1px solid rgb(98 210 226 / 0.5); color: #9fe4ee; }

.ticker { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: 12px/1.4 var(--mono); }
.ticker code { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1em; }
.ticker .outcome { color: var(--muted); white-space: nowrap; }
.ticker .outcome.ok { color: var(--good); }
.ticker .outcome.error { color: var(--bad); font-weight: 600; }

@media (max-width: 720px) {
  .hud-top { padding: 6px 8px; }
  .score { font-size: 16px; }
  .progress { width: 90px; }
  .boss { top: 34px; }
  .hint-banner { position: static; transform: none; max-width: none; border-radius: 0; border-width: 1px 0 0; display: none; }
  .hint-banner.show { display: block; transform: none; }
  .overlay.show { position: static; }
  .overlay.paused { background: #05060a; }
  .wordmark { padding-top: 8px; }
}
@media (prefers-reduced-motion: reduce) { .dock-button.ready { animation: none; } .stinger.go { animation-duration: 0.01s; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.card-head h2 { margin-right: auto; }
.head-tools, .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.devices-head { border-top: 1px solid var(--line); padding-top: 12px; }

.chip, .primary, .segmented button, .tab {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 10px; cursor: pointer;
  font-size: 13px; line-height: 1.3; white-space: nowrap;
}
.chip:hover, .segmented button:hover { border-color: var(--muted); }
.chip.quiet { border-style: dashed; color: var(--muted); }
.chip[aria-pressed="true"], .segmented button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip.toggle[aria-pressed="true"]::before { content: "● "; color: var(--accent); }
.chip.gradient { padding-bottom: 9px; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--surface); position: relative; }
.chip.gradient::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 3px; height: 4px; border-radius: 2px; background: var(--preview); }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.primary:disabled { opacity: 0.5; cursor: not-allowed; }
.segmented { display: inline-flex; }
.segmented button { border-radius: 0; margin-left: -1px; padding: 4px 9px; font-size: 12px; }
.segmented button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.segmented button:last-child { border-radius: 0 7px 7px 0; }
.segmented button[aria-pressed="true"] { position: relative; z-index: 1; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { display: inline-flex; align-items: center; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.on { background: var(--accent); border-color: var(--accent); }

.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.identity { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.label-edit, .tools { display: flex; gap: 6px; flex-wrap: wrap; }
.label-edit input { border: 1px solid var(--line); background: var(--sunken); border-radius: 7px; padding: 5px 9px; font-weight: 600; width: 15ch; min-width: 0; }
.meta { color: var(--muted); font: 12px/1.6 var(--mono); overflow-wrap: anywhere; }
.pill { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; white-space: nowrap; }
.block { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.block-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.fade { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px 20px; }
.hint, .note, .status, .empty { color: var(--muted); font-size: 12.5px; }
.note.bad, .status.bad { color: var(--bad); }
.status { min-height: 1.45em; }
.status:empty { display: none; }
.empty { padding: 8px 0; }

.slider { display: grid; grid-template-columns: 78px minmax(0, 1fr) 118px; align-items: center; gap: 10px; }
.slider label { font-size: 13px; }
.readout { font: 12px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 480px) { .slider { grid-template-columns: 70px minmax(0, 1fr); } .readout { grid-column: 2; text-align: left; } }
input[type="range"] { appearance: none; -webkit-appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--track, var(--line)); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.14); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--track, var(--line)); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.14); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -4px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
.swatch-row { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch-button { width: 28px; height: 22px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.swatch-button:hover { border-color: var(--ink); }

.counters { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counters b { color: var(--ink); font-weight: 600; }

/* Wire log */
.tag { display: inline-block; font: 600 10px/1 var(--mono); letter-spacing: 0.04em; padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; text-align: center; }
.tag.tx { color: var(--tx); }
.tag.rx { color: var(--rx); }
.tag.call { color: var(--call); }
.log-legend { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; color: var(--muted); font-size: 12px; }
.log-legend .tag { margin-left: 8px; }
.log-legend .tag:first-child { margin-left: 0; }
.log-list { height: 330px; overflow-y: auto; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 4px; font: 12px/1.35 var(--mono); }
.row { display: grid; align-items: baseline; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 3px 6px; border-radius: 5px; cursor: pointer; font: inherit; color: var(--ink); }
.row.packet { grid-template-columns: 6ch 3.6ch minmax(0, 1.25fr) minmax(0, 0.9fr) minmax(0, 1.15fr); }
.row.call { grid-template-columns: 6ch 3.6ch minmax(0, 1fr) auto; margin-top: 3px; }
.row:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.row.selected { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.row .time { color: var(--muted); font-variant-numeric: tabular-nums; }
.row .tag { padding: 2px 0; border: 0; text-align: left; }
.row .what { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.tx .what { color: var(--tx); }
.row.rx .what { color: var(--rx); }
.row .peer, .row .meta { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { text-align: right; }
